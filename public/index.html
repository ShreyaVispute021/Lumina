<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <canvas id="bg-canvas"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Join Screen -->
    <div id="join-screen">
        <div class="join-card">
            <div class="join-logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="19" stroke="url(#g1)" stroke-width="1.5" />
                    <path d="M11 25 Q20 11 29 25" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round"
                        fill="none" />
                    <circle cx="14.5" cy="22" r="2.2" fill="url(#g1)" />
                    <circle cx="25.5" cy="22" r="2.2" fill="url(#g1)" />
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#c084fc" />
                            <stop offset="100%" stop-color="#38bdf8" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="join-title">Lumina</h1>
            <p class="join-sub">Real-time conversations, beautifully crafted.</p>
            <div class="field">
                <label>Your name</label>
                <input id="username" type="text" placeholder="e.g. Alex" autocomplete="off" />
            </div>
            <div class="field">
                <label>Room</label>
                <input id="room" type="text" placeholder="e.g. general" autocomplete="off"
                    onkeydown="if(event.key==='Enter') joinRoom()" />
            </div>
            <button class="join-btn" onclick="joinRoom()">
                <span>Enter Room</span>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="19" stroke="url(#g2)" stroke-width="1.5" />
                    <path d="M11 25 Q20 11 29 25" stroke="url(#g2)" stroke-width="2.2" stroke-linecap="round"
                        fill="none" />
                    <circle cx="14.5" cy="22" r="2.2" fill="url(#g2)" />
                    <circle cx="25.5" cy="22" r="2.2" fill="url(#g2)" />
                    <defs>
                        <linearGradient id="g2" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#c084fc" />
                            <stop offset="100%" stop-color="#38bdf8" />
                        </linearGradient>
                    </defs>
                </svg>
                <span class="brand-name">Lumina</span>
            </div>
            <div class="sidebar-label">Rooms</div>
            <div class="sidebar-room active">
                <span class="room-dot"></span>
                <span id="sidebar-room-name">—</span>
            </div>
            <div class="sidebar-footer">
                <div class="user-pill">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <span id="sidebar-username">—</span>
                </div>
                <div id="online-count" class="online-pill">0 online</div>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <span class="hash">#</span>
                    <strong id="header-room">room</strong>
                </div>
                <div id="typing-wrap" class="typing-wrap"></div>
            </header>

            <div id="messages"></div>

            <div class="input-bar">
                <input id="msg-input" type="text" placeholder="Write something…" autocomplete="off"
                    onkeydown="if(event.key==='Enter') sendMessage()" oninput="handleTyping()" />
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
